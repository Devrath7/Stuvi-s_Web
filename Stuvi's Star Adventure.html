<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>Stuvi's Star Adventure</title>
<style>
  :root{
    --sky-top:#7ec8e3;
    --sky-bot:#bfe9ff;
    --ground:#7cc576;
    --ground-dark:#5fae5a;
    --panel:#ffffffcc;
    --ink:#2d2540;
    --accent:#ff6f91;
    --accent2:#ffd93d;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color: transparent;}
  html,body{
    margin:0; padding:0; height:100%; overflow:hidden;
    font-family:'Baloo 2','Trebuchet MS',system-ui,sans-serif;
    background:var(--sky-top);
    padding-top:env(safe-area-inset-top,0px);
    padding-bottom:env(safe-area-inset-bottom,0px);
  }
  #wrap{
    position:relative; width:100%; height:100%;
    display:flex; align-items:center; justify-content:center;
  }
  canvas{
    display:block;
    width:100%; height:100%;
    touch-action:none;
  }
  #hud{
    position:absolute; top:calc(12px + env(safe-area-inset-top,0px)); left:12px; right:12px;
    display:flex; justify-content:space-between; align-items:flex-start;
    pointer-events:none; font-weight:700; color:var(--ink);
  }
  .pill{
    background:var(--panel); padding:8px 14px; border-radius:20px;
    box-shadow:0 3px 0 #00000022; font-size:15px;
  }
  #overlay{
    position:absolute; inset:0; display:flex; align-items:center; justify-content:center;
    background:linear-gradient(180deg, #6f9bd1cc, #a8d8ffcc);
    text-align:center; color:var(--ink); flex-direction:column; gap:14px; padding:24px;
  }
  #overlay h1{ font-size:clamp(26px,7vw,42px); margin:0; color:var(--accent); text-shadow:2px 2px 0 #fff;}
  #overlay p{ margin:0; font-size:15px; max-width:340px; }
  button{
    font-family:inherit; font-weight:800; font-size:18px;
    background:var(--accent2); color:#5a4200; border:none; border-radius:16px;
    padding:14px 30px; box-shadow:0 4px 0 #c9a400; cursor:pointer;
  }
  button:active{ transform:translateY(3px); box-shadow:0 1px 0 #c9a400; }
  #hidden{display:none;}
  .badge{font-size:13px; opacity:.85; margin-top:-6px;}
</style>
</head>
<body>
<div id="wrap">
  <canvas id="game"></canvas>
  <div id="hud">
    <div class="pill">⭐ <span id="scoreVal">0</span></div>
    <div class="pill">🏆 <span id="bestVal">0</span></div>
  </div>
  <div id="overlay">
    <h1>Stuvi's Star Adventure</h1>
    <p>Help Stuvi hop over rocks, duck under clouds, and grab as many stars as you can! Tap / Space to jump. Swipe down / hold to duck.</p>
    <button id="startBtn">Let's Go! ▶</button>
    <p class="badge" id="msg"></p>
  </div>
</div>

<script>
(function(){
  const canvas = document.getElementById('game');
  const ctx = canvas.getContext('2d');
  const overlay = document.getElementById('overlay');
  const startBtn = document.getElementById('startBtn');
  const scoreVal = document.getElementById('scoreVal');
  const bestVal = document.getElementById('bestVal');
  const msg = document.getElementById('msg');

  let W, H, DPR;
  function resize(){
    DPR = Math.min(window.devicePixelRatio||1, 2);
    W = canvas.clientWidth; H = canvas.clientHeight;
    canvas.width = W*DPR; canvas.height = H*DPR;
    ctx.setTransform(DPR,0,0,DPR,0,0);
    groundY = H*0.78;
  }
  window.addEventListener('resize', resize);

  let groundY = 300;
  let running = false;
  let score = 0;
  let best = 0;
  try{ best = parseInt(localStorage.getItem('stuvi_best')||'0',10) || 0; }catch(e){ best = 0; }
  bestVal.textContent = best;

  // Player (Stuvi) state
  const player = {
    x: 90, y: 0, w: 46, h: 58,
    vy: 0, ducking:false,
    onGround:true,
    legPhase:0
  };
  const GRAVITY = 0.0018;
  const JUMP_V = -0.62;

  let speed = 0.34; // px/ms
  let spawnTimer = 0;
  let nextSpawn = 900;
  let obstacles = [];
  let stars = [];
  let particles = [];
  let clouds = [];
  let elapsed = 0;
  let lastTime = 0;
  let shake = 0;

  function resetGame(){
    score = 0;
    speed = 0.34;
    obstacles = []; stars = []; particles = [];
    player.y = groundY - player.h;
    player.vy = 0; player.onGround = true; player.ducking = false;
    spawnTimer = 0; nextSpawn = 900;
    elapsed = 0;
    scoreVal.textContent = '0';
    clouds = [];
    for(let i=0;i<5;i++){
      clouds.push({x: Math.random()*W, y: 30+Math.random()*80, s: 0.5+Math.random()*0.8, sp: 0.02+Math.random()*0.03});
    }
  }

  function jump(){
    if(!running) return;
    if(player.onGround){
      player.vy = JUMP_V;
      player.onGround = false;
      spawnParticles(player.x+player.w/2, groundY, 6, '#ffffffaa');
    }
  }
  function duck(v){
    if(!running) return;
    player.ducking = v && player.onGround;
  }

  function spawnParticles(x,y,n,color){
    for(let i=0;i<n;i++){
      particles.push({
        x, y, vx:(Math.random()-0.5)*0.15, vy:-Math.random()*0.15,
        life: 400+Math.random()*300, age:0, color
      });
    }
  }

  function spawnObstacle(){
    const r = Math.random();
    if(r < 0.55){
      // ground rock/cactus
      const h = 34 + Math.random()*26;
      obstacles.push({type:'ground', x: W+20, y: groundY-h, w: 28+Math.random()*10, h, passed:false});
    } else {
      // flying cloud obstacle - must duck
      const h = 30;
      obstacles.push({type:'air', x: W+20, y: groundY - player.h - 8, w: 46, h, passed:false});
    }
    if(Math.random() < 0.7){
      stars.push({x: W + 60 + Math.random()*40, y: groundY - 90 - Math.random()*70, r:10, collected:false, bob:Math.random()*Math.PI*2});
    }
  }

  function rectsOverlap(a,b){
    return a.x < b.x+b.w && a.x+a.w > b.x && a.y < b.y+b.h && a.y+a.h > b.y;
  }

  function update(dt){
    elapsed += dt;
    speed = Math.min(0.34 + elapsed*0.000006, 0.75);

    // player physics
    if(!player.onGround){
      player.vy += GRAVITY*dt;
      player.y += player.vy*dt;
      if(player.y >= groundY - player.h){
        player.y = groundY - player.h;
        player.vy = 0;
        player.onGround = true;
      }
    } else {
      player.y = groundY - (player.ducking ? player.h*0.6 : player.h);
      player.legPhase += dt*0.012;
    }

    // spawn
    spawnTimer += dt;
    if(spawnTimer > nextSpawn){
      spawnTimer = 0;
      nextSpawn = 700 + Math.random()*600 - Math.min(elapsed*0.00005,250);
      nextSpawn = Math.max(nextSpawn, 450);
      spawnObstacle();
    }

    // move obstacles
    const dx = speed*dt;
    for(const o of obstacles){ o.x -= dx; }
    obstacles = obstacles.filter(o=> o.x+o.w > -20);

    for(const s of stars){ s.x -= dx; s.bob += dt*0.006; }
    stars = stars.filter(s=> s.x > -30 && !s.collected);

    for(const c of clouds){
      c.x -= c.sp*dt;
      if(c.x < -60) c.x = W+60;
    }

    // particles
    for(const p of particles){
      p.age += dt; p.x += p.vx*dt; p.y += p.vy*dt; p.vy += 0.0006*dt;
    }
    particles = particles.filter(p=> p.age < p.life);

    // collisions
    const pw = player.ducking ? player.w*1.1 : player.w*0.7;
    const ph = player.ducking ? player.h*0.55 : player.h*0.85;
    const pbox = { x: player.x + (player.w-pw)/2, y: player.y + (player.h - (player.ducking?player.h*0.6:player.h)) + (player.ducking?0:6), w: pw, h: ph };

    for(const o of obstacles){
      const obox = {x:o.x, y:o.y, w:o.w, h:o.h};
      if(rectsOverlap(pbox, obox)){
        gameOver();
        return;
      }
      if(!o.passed && o.x+o.w < player.x){ o.passed = true; score += 1; scoreVal.textContent = score; }
    }
    for(const s of stars){
      if(s.collected) continue;
      const sd = Math.hypot((player.x+player.w/2)-s.x, (player.y+player.h/2)-(s.y+Math.sin(s.bob)*6));
      if(sd < 34){
        s.collected = true; score += 5; scoreVal.textContent = score;
        spawnParticles(s.x, s.y, 10, '#ffd93d');
      }
    }
  }

  function gameOver(){
    running = false;
    if(score > best){ best = score; try{ localStorage.setItem('stuvi_best', String(best)); }catch(e){} }
    bestVal.textContent = best;
    shake = 300;
    overlay.style.display = 'flex';
    document.getElementById('startBtn').textContent = 'Try Again ▶';
    msg.textContent = score >= best && score>0 ? "New best score! Stuvi is proud of you! ⭐" : "Score: " + score + " — tap to play again!";
  }

  // ---- Drawing ----
  function drawBackground(){
    const g = ctx.createLinearGradient(0,0,0,H);
    g.addColorStop(0, '#7ec8e3');
    g.addColorStop(1, '#d6f3ff');
    ctx.fillStyle = g;
    ctx.fillRect(0,0,W,H);

    // sun
    ctx.beginPath();
    ctx.fillStyle = '#fff2b0';
    ctx.arc(W-60, 60, 34, 0, Math.PI*2);
    ctx.fill();

    // clouds
    ctx.fillStyle = '#ffffffdd';
    for(const c of clouds){
      drawCloud(c.x, c.y, 30*c.s);
    }

    // ground
    ctx.fillStyle = 'var(--ground)';
    ctx.fillStyle = '#7cc576';
    ctx.fillRect(0, groundY, W, H-groundY);
    ctx.fillStyle = '#5fae5a';
    ctx.fillRect(0, groundY, W, 10);
    // grass tufts
    ctx.fillStyle = '#4f9a4c';
    for(let x=(-(elapsed*speed*1)%40); x<W; x+=40){
      ctx.fillRect(x, groundY, 4, 8);
    }
  }
  function drawCloud(x,y,s){
    ctx.beginPath();
    ctx.arc(x, y, s, 0, Math.PI*2);
    ctx.arc(x+s*0.8, y+4, s*0.75, 0, Math.PI*2);
    ctx.arc(x-s*0.8, y+6, s*0.6, 0, Math.PI*2);
    ctx.fill();
  }

  function drawObstacle(o){
    if(o.type === 'ground'){
      ctx.fillStyle = '#8a7a68';
      ctx.beginPath();
      ctx.moveTo(o.x, o.y+o.h);
      ctx.lineTo(o.x+o.w*0.2, o.y);
      ctx.lineTo(o.x+o.w*0.5, o.y+o.h*0.25);
      ctx.lineTo(o.x+o.w*0.8, o.y);
      ctx.lineTo(o.x+o.w, o.y+o.h);
      ctx.closePath();
      ctx.fill();
      ctx.fillStyle = '#6e6153';
      ctx.fillRect(o.x, o.y+o.h-4, o.w, 4);
    } else {
      ctx.fillStyle = '#ffffffee';
      drawCloud(o.x+o.w/2, o.y+o.h/2, o.h*0.7);
    }
  }

  function drawStar(s){
    if(s.collected) return;
    const bob = Math.sin(s.bob)*6;
    ctx.save();
    ctx.translate(s.x, s.y+bob);
    ctx.fillStyle = '#ffd93d';
    ctx.strokeStyle = '#e6a800';
    ctx.lineWidth = 1.5;
    ctx.beginPath();
    for(let i=0;i<5;i++){
      const a = -Math.PI/2 + i*(Math.PI*2/5);
      const a2 = a + Math.PI/5;
      ctx.lineTo(Math.cos(a)*s.r, Math.sin(a)*s.r);
      ctx.lineTo(Math.cos(a2)*s.r*0.45, Math.sin(a2)*s.r*0.45);
    }
    ctx.closePath();
    ctx.fill();
    ctx.stroke();
    ctx.restore();
  }

  function drawPlayer(){
    const px = player.x, py = player.y, pw = player.w;
    const ph = player.ducking ? player.h*0.6 : player.h;
    ctx.save();
    ctx.translate(px, py);

    // legs
    if(player.onGround){
      const swing = Math.sin(player.legPhase)*8;
      ctx.strokeStyle = '#3a2e50';
      ctx.lineWidth = 6;
      ctx.lineCap = 'round';
      ctx.beginPath();
      ctx.moveTo(pw*0.35, ph-4); ctx.lineTo(pw*0.35+swing*0.3, ph+10);
      ctx.moveTo(pw*0.65, ph-4); ctx.lineTo(pw*0.65-swing*0.3, ph+10);
      ctx.stroke();
    } else {
      ctx.strokeStyle = '#3a2e50';
      ctx.lineWidth = 6; ctx.lineCap='round';
      ctx.beginPath();
      ctx.moveTo(pw*0.3, ph-6); ctx.lineTo(pw*0.15, ph+12);
      ctx.moveTo(pw*0.7, ph-6); ctx.lineTo(pw*0.85, ph+8);
      ctx.stroke();
    }

    // body dress
    ctx.fillStyle = '#ff6f91';
    ctx.beginPath();
    ctx.moveTo(pw*0.5, ph*0.32);
    ctx.lineTo(pw*0.85, ph*0.95);
    ctx.lineTo(pw*0.15, ph*0.95);
    ctx.closePath();
    ctx.fill();

    // arms
    ctx.strokeStyle = '#ffcfa8';
    ctx.lineWidth = 6; ctx.lineCap='round';
    ctx.beginPath();
    const armSwing = player.onGround ? Math.sin(player.legPhase)*10 : -14;
    ctx.moveTo(pw*0.5, ph*0.45); ctx.lineTo(pw*0.18, ph*0.6+armSwing*0.2);
    ctx.moveTo(pw*0.5, ph*0.45); ctx.lineTo(pw*0.82, ph*0.6-armSwing*0.2);
    ctx.stroke();

    // head
    ctx.fillStyle = '#ffcfa8';
    ctx.beginPath();
    ctx.arc(pw*0.5, ph*0.2, pw*0.32, 0, Math.PI*2);
    ctx.fill();

    // hair (twin buns, playful)
    ctx.fillStyle = '#4a2f22';
    ctx.beginPath();
    ctx.arc(pw*0.24, ph*0.06, pw*0.16, 0, Math.PI*2);
    ctx.arc(pw*0.76, ph*0.06, pw*0.16, 0, Math.PI*2);
    ctx.fill();
    ctx.beginPath();
    ctx.arc(pw*0.5, ph*0.14, pw*0.34, Math.PI*1.05, Math.PI*1.95);
    ctx.fill();

    // face
    ctx.fillStyle = '#3a2e50';
    ctx.beginPath();
    ctx.arc(pw*0.4, ph*0.2, 2.6, 0, Math.PI*2);
    ctx.arc(pw*0.6, ph*0.2, 2.6, 0, Math.PI*2);
    ctx.fill();
    ctx.strokeStyle = '#c9506f';
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.arc(pw*0.5, ph*0.24, 5, 0.15*Math.PI, 0.85*Math.PI);
    ctx.stroke();

    ctx.restore();
  }

  function drawParticles(){
    for(const p of particles){
      const a = 1 - p.age/p.life;
      ctx.globalAlpha = Math.max(a,0);
      ctx.fillStyle = p.color;
      ctx.beginPath();
      ctx.arc(p.x, p.y, 3, 0, Math.PI*2);
      ctx.fill();
    }
    ctx.globalAlpha = 1;
  }

  function render(){
    ctx.save();
    if(shake > 0){
      ctx.translate((Math.random()-0.5)*6, (Math.random()-0.5)*6);
    }
    drawBackground();
    for(const s of stars) drawStar(s);
    for(const o of obstacles) drawObstacle(o);
    drawPlayer();
    drawParticles();
    ctx.restore();
  }

  function loop(t){
    if(!lastTime) lastTime = t;
    const dt = Math.min(t - lastTime, 40);
    lastTime = t;
    if(shake>0) shake -= dt;
    if(running){
      update(dt);
    }
    render();
    requestAnimationFrame(loop);
  }

  function startGame(){
    resize();
    resetGame();
    running = true;
    overlay.style.display = 'none';
  }

  startBtn.addEventListener('click', startGame);

  // controls
  window.addEventListener('keydown', (e)=>{
    if(e.code === 'Space' || e.code==='ArrowUp'){ e.preventDefault(); jump(); }
    if(e.code === 'ArrowDown'){ duck(true); }
  });
  window.addEventListener('keyup', (e)=>{
    if(e.code === 'ArrowDown'){ duck(false); }
  });

  let touchStartY = 0;
  canvas.addEventListener('touchstart', (e)=>{
    touchStartY = e.touches[0].clientY;
    jump();
  }, {passive:true});
  canvas.addEventListener('touchmove', (e)=>{
    const dy = e.touches[0].clientY - touchStartY;
    if(dy > 30) duck(true);
  }, {passive:true});
  canvas.addEventListener('touchend', ()=>{ duck(false); }, {passive:true});
  canvas.addEventListener('mousedown', ()=> jump());

  resize();
  render();
  requestAnimationFrame(loop);
})();
</script>
</body>
</html>
